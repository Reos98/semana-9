<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedTurnos Leo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-hospital me-2"></i>MedTurnos Leo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="nav-link" href="/">Inicio</a>
                    {% if current_user.is_authenticated %}
                        <a class="nav-link" href="/agendar">Agendar Cita</a>
                        <a class="nav-link" href="/reporte_citas">Reportes</a>
                        <div class="ms-lg-3 d-flex align-items-center border-start ps-lg-3">
                            <span class="navbar-text me-3 text-info fw-bold">{{ current_user.nombre }}</span>
                            <a class="btn btn-outline-danger btn-sm" href="/logout">Salir</a>
                        </div>
                    {% else %}
                        <a class="btn btn-primary btn-sm px-4" href="/login">Iniciar Sesión</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    <main class="container mt-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>
    <footer class="text-center mt-auto py-4 border-top bg-white small text-muted">
        © 2026 Sistema de Turnos - Byron Montoya
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
