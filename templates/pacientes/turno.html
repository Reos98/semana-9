{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                    <h4 class="mb-0"><i class="bi bi-calendar-check me-2"></i>Agendar Nueva Cita</h4>
                    <p class="mb-0 small text-white-50">Complete los datos para el registro en el sistema</p>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('nuevo') }}" method="POST">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Nombre del Paciente <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" name="nombre" class="form-control" placeholder="Ej. Byron Montoya" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Especialidad Médica <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-stethoscope"></i></span>
                                <select name="especialidad" class="form-select" required>
                                    <option value="" selected disabled>Seleccione una opción...</option>
                                    <option value="Odontología">Odontología</option>
                                    <option value="Medicina General">Medicina General</option>
                                    <option value="Pediatría">Pediatría</option>
                                    <option value="Cardiología">Cardiología</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Fecha de la Cita <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-calendar-event"></i></span>
                                <input type="date" name="fecha" class="form-control" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                                <i class="bi bi-plus-circle me-2"></i>Confirmar Agendamiento
                            </button>
                            <a href="/" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Regresar al Inicio
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
