{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg p-5 rounded-4 bg-white">
            <div class="text-center mb-5">
                <div class="display-3 text-info mb-3"><i class="bi bi-person-circle text-primary"></i></div>
                <h1 class="fw-bold text-dark">Mi Perfil</h1>
                <p class="text-muted">Gestiona tu información personal y seguridad.</p>
                <hr class="mx-auto" style="width: 80px; height: 3px; background-color: #0d6efd; border: none;">
            </div>

            <form action="/perfil" method="POST">
                <!-- ID de Usuario oculto -->
                <input type="hidden" name="usuario_id" value="{{ current_user.id }}">

                <div class="mb-4">
                    <label for="email_show" class="form-label fw-bold">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control bg-light" id="email_show" value="{{ current_user.email }}" readonly>
                    </div>
                    <small class="text-muted">Este correo se utiliza para tu ingreso al sistema.</small>
                </div>

                <div class="mb-4">
                    <label for="nombre" class="form-label fw-bold">Nombre Completo <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ current_user.nombre }}" required>
                    </div>
                </div>

                <div class="mb-5">
                    <label for="password" class="form-label fw-bold text-danger"><i class="bi bi-key-fill me-1"></i>Resetear Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Dejar en blanco para no cambiar">
                    </div>
                    <small class="text-muted mt-2 d-block">Escribe una nueva contraseña solo si deseas cambiarla.</small>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                        <i class="bi bi-save2-fill me-2"></i>Guardar Cambios
                    </button>
                    <a href="/" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
