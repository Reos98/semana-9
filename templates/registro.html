{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-success text-white text-center py-4 rounded-top-4">
                    <h3>Crear Cuenta</h3>
                </div>
                <div class="card-body p-5">
                    <form action="/nuevo_usuario" method="POST">
                        <div class="mb-3">
                            <label class="fw-bold">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold">Correo Electrónico</label>
                            <input type="email" name="mail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold">Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 btn-lg mt-3">Registrarme</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
