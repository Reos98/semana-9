{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-success text-white text-center py-4 rounded-top-4">
                    <h3>Crear Cuenta</h3>
                </div>
                <div class="card-body p-5">
                    <form action="/nuevo_usuario" method="POST">
                        <div class="mb-3">
                            <label class="fw-bold mb-2">Nombre Completo <span class="text-danger">*</span></label>
                            <input type="text" name="nombre" class="form-control" placeholder="Ej: Byron Montoya" required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold mb-2">Correo Electrónico <span class="text-danger">*</span></label>
                            <input type="email" name="mail" class="form-control" placeholder="ejemplo@mail.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold mb-2">Contraseña <span class="text-danger">*</span></label>
                            <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 btn-lg mt-3 shadow-sm">
                            <i class="bi bi-person-plus-fill me-2"></i>Crear Cuenta
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
