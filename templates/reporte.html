{% extends "base.html" %}
{% block content %}
<div class="container mt-4 text-center">
    <h2><i class="bi bi-file-earmark-text me-2"></i>Reporte de Citas Médicas</h2>
    <div class="table-responsive mt-4">
        <table class="table table-hover table-bordered shadow">
            <thead class="table-dark">
                <tr>
                    <th>Médico</th>
                    <th>Paciente</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody>
                {% for cita in citas %}
                <tr>
                    <td>{{ cita.Medico }}</td>
                    <td>{{ cita.Paciente }}</td>
                    <td>{{ cita.Fecha_Cita }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3">No hay citas registradas en MariaDB.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
